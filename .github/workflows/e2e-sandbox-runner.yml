name: e2e-sandbox-runner

# Manual only. The ONE place the full Stage-3 Variant-A chain is exercised for
# real: backend client → HTTP over the runner's Unix socket → sandbox-runner →
# docker-socket-proxy → real dockerd. No function is called directly and no
# docker call is mocked. GitHub-hosted ubuntu-latest has Docker pre-installed.
#
# Proves, over real HTTP:
#   1. the proxy allowlist is live (a denied endpoint really returns 403);
#   2. the runner sees docker ONLY through the proxy (/healthz docker:true);
#   3. all three deploy-pack stacks build + run + boot-check through the chain;
#   4. a fixpack install+test suite runs real containers through the chain.
#
# The runner is started UNDER the shipped mount-namespace directives
# (PrivateTmp=true) via systemd-run, NOT as a bare `uvicorn &` — so PrivateTmp's
# private /tmp is real in CI and the docker-bind-mount namespace bug can actually
# reproduce here (a bare process shares the host /tmp and hid it).
on:
  workflow_dispatch: {}
  # Also run when this workflow (or the chain it exercises) changes on a PR, so
  # the full real chain is proven on the PR itself — workflow_dispatch alone
  # can't be triggered from a non-default branch.
  pull_request:
    paths:
      - "app/runner/**"
      - "app/sandbox_client.py"
      - "deploy/sandbox-runner/**"
      - "scripts/e2e_fixpack_run_suite.py"
      - "scripts/smoke_verify_*.py"
      - "scripts/check_runner_build_dir_perms.py"
      - "scripts/check_runner_bindmount_namespace.py"
      - ".github/workflows/e2e-sandbox-runner.yml"

jobs:
  # Behavioural guard for the build-dir permission incident: run the runner's
  # own mkdtemp+extract filesystem ops under the SHIPPED systemd sandbox
  # directives (via systemd-run) and prove they succeed — and that adding
  # UMask=0117 back makes them fail. GitHub's ubuntu runners are systemd hosts.
  build-dir-perms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Create the unprivileged shipit-runner user (matches prod)
        # The bug only bites a NON-root process (root has CAP_DAC_OVERRIDE), so
        # the guard runs its probe as this user — exactly as prod does.
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin shipit-runner
      - name: Runner build dir usable under the shipped sandbox directives
        run: python scripts/check_runner_build_dir_perms.py

  # Behavioural guard for the SECOND incident: PrivateTmp gives the runner a
  # private /tmp invisible to dockerd, so a build dir under /tmp bind-mounts into
  # a fixpack container as an EMPTY /work. This job runs the runner's real
  # mkdtemp + `docker run -v <dir>:/work` cycle under the SHIPPED PrivateTmp +
  # StateDirectory + TMPDIR directives (via systemd-run, on a real docker host)
  # and asserts the container SEES the file — with a TMPDIR=/tmp negative control
  # that must come back empty. Catches a namespace split, not just permissions.
  bindmount-namespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pre-pull the tiny probe image (shared daemon image store)
        run: docker pull busybox
      - name: Runner bind mount crosses the PrivateTmp namespace
        run: python scripts/check_runner_bindmount_namespace.py

  e2e:
    runs-on: ubuntu-latest
    env:
      # Socket lives OUTSIDE /tmp (in a RuntimeDirectory), like prod — a socket
      # under /tmp would be trapped in the runner's PrivateTmp namespace and the
      # test client could not reach it. Build proxy cleared (a GitHub runner has
      # no host Squid); this mirrors what the prod host provides differently.
      SANDBOX_RUNNER_UDS: /run/shipit-runner/sandbox.sock
      DEPLOYPACK_BUILD_PROXY_URL: ""
      FIXPACK_INSTALL_PROXY_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install shipit (locked, hash-verified deps)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Generate the shared runner token
        run: echo "SANDBOX_RUNNER_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Start docker-socket-proxy (the only thing touching the real socket)
        run: |
          set -euxo pipefail
          docker compose -f deploy/sandbox-runner/docker-socket-proxy.yml up -d
          # Wait for the proxy to answer an ALLOWED endpoint (/version, VERSION=1).
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2375/version >/dev/null 2>&1; then
              echo "proxy up"; break
            fi
            sleep 1
            if [ "$i" = 30 ]; then
              echo "proxy never came up — dumping state" >&2
              docker compose -f deploy/sandbox-runner/docker-socket-proxy.yml ps -a >&2 || true
              docker compose -f deploy/sandbox-runner/docker-socket-proxy.yml logs --no-color >&2 || true
              exit 1
            fi
          done

      - name: Prove the proxy allowlist is real (denied endpoint → 403)
        run: |
          set -uxo pipefail
          # INFO=0, so /info must be refused by the proxy. This is the half a
          # mock can't prove: the endpoint filter is actually enforced.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2375/info)
          echo "GET /info via proxy → HTTP $code"
          if [ "$code" != "403" ]; then
            echo "FAIL: proxy did not deny /info (got $code, expected 403)" >&2
            exit 1
          fi
          echo "OK: proxy enforces its endpoint allowlist"

      - name: Create the no-egress preview network (host-configured on prod)
        run: |
          set -euxo pipefail
          docker network create shipit-preview
          SUBNET=$(docker network inspect shipit-preview \
                   -f '{{(index .IPAM.Config 0).Subnet}}')
          echo "preview subnet: $SUBNET"
          sudo iptables -I DOCKER-USER -s "$SUBNET" ! -d "$SUBNET" -j DROP

      - name: Start the sandbox-runner UNDER PrivateTmp (prod-faithful, via systemd-run)
        run: |
          set -euxo pipefail
          # Start the runner as a TRANSIENT SYSTEMD SERVICE carrying the shipped
          # mount-namespace directives (PrivateTmp=true) PLUS the fix
          # (StateDirectory + TMPDIR outside /tmp). This is the whole point of the
          # change: a bare `uvicorn &` shares the host /tmp and can NEVER reproduce
          # the PrivateTmp namespace bug, which is exactly how it slipped through
          # before. The namespace split is uid-independent, so running as root here
          # is faithful. DOCKER_HOST → proxy (BuildKit off; the proxy has no grpc
          # session endpoint). The socket goes in a RuntimeDirectory (outside /tmp)
          # at 0755 so the non-root test client can reach it — prod uses 0710 + a
          # root backend; socket perms aren't what this job validates, the
          # namespace is.
          PYBIN=$(command -v python)
          sudo systemd-run --unit=shipit-sandbox-runner --collect \
            -p PrivateTmp=true \
            -p StateDirectory=shipit-runner \
            -p RuntimeDirectory=shipit-runner \
            -p RuntimeDirectoryMode=0755 \
            -p "Environment=TMPDIR=/var/lib/shipit-runner" \
            -p "Environment=DOCKER_HOST=tcp://127.0.0.1:2375" \
            -p "Environment=DOCKER_BUILDKIT=0" \
            -p "Environment=SANDBOX_RUNNER_TOKEN=$SANDBOX_RUNNER_TOKEN" \
            -p "Environment=DEPLOYPACK_BUILD_PROXY_URL=" \
            -p "Environment=FIXPACK_INSTALL_PROXY_URL=" \
            -p "WorkingDirectory=$PWD" \
            -- "$PYBIN" -m uvicorn app.runner.main:app \
               --uds "$SANDBOX_RUNNER_UDS" --workers 1
          sudo systemctl status shipit-sandbox-runner --no-pager || true

      - name: Wait for the runner to report docker:true over its Unix socket
        run: |
          set -uxo pipefail
          for i in $(seq 1 30); do
            body=$(curl -fsS --unix-socket "$SANDBOX_RUNNER_UDS" \
                   http://runner/healthz 2>/dev/null || true)
            echo "healthz: $body"
            if echo "$body" | grep -q '"docker": *true'; then
              echo "runner healthy, docker reachable via proxy"; break
            fi
            sleep 1
            if [ "$i" = 30 ]; then
              echo "runner never became healthy; journal:" >&2
              sudo journalctl -u shipit-sandbox-runner --no-pager >&2 || true
              exit 1
            fi
          done

      - name: Deploy-pack — all three stacks, build+run+boot through the chain
        run: python scripts/smoke_verify_deploy_pack.py

      - name: Fixpack — install+test suite through the chain
        run: python scripts/e2e_fixpack_run_suite.py

      - name: Preview — keep-alive container + curl + reap through the chain
        run: python scripts/smoke_verify_preview.py

      - name: Reap endpoint — real backend uvicorn → runner reconcile over HTTP
        run: python scripts/smoke_verify_reap_endpoint.py

      - name: Runner log (always, for debugging)
        if: always()
        run: sudo journalctl -u shipit-sandbox-runner --no-pager || true

      - name: Tear down
        if: always()
        run: |
          sudo systemctl stop shipit-sandbox-runner || true
          docker compose -f deploy/sandbox-runner/docker-socket-proxy.yml down || true
