name: local-package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: local-package-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha }}-${{ inputs.release_tag }}
  cancel-in-progress: true

jobs:
  standalone:
    name: local-package (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            python: '3.12'
          - os: macos-14
            platform: macos-arm64
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare the four runtime dependencies and locked build backend
        run: |
          python scripts/build_local_package.py --out "$RUNNER_TEMP/drydock-bootstrap" --stage-only
          python -m pip install --require-hashes \
            -r "$RUNNER_TEMP/drydock-bootstrap/build-requirements.txt" \
            -r "$RUNNER_TEMP/drydock-bootstrap/source/requirements.txt"
      - name: Build wheel, independent source archive and offline installation bundle
        run: |
          python scripts/build_local_package.py --out "$RUNNER_TEMP/drydock-bundle" --wheelhouse
          PYTHONPATH=. python scripts/verify_local_package.py \
            --module app --write-reference "$RUNNER_TEMP/source-reference.json"
      # Release tooling comes from this reviewed workflow revision, allowing an
      # existing production tag to be packaged without changing its engine.
      - uses: actions/checkout@v7
        if: inputs.source_sha != ''
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Create checksummed installation archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLATFORM: ${{ matrix.platform }}
          PYTHON_MINOR: ${{ matrix.python }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          script=scripts/archive_local_package.py
          if [[ -n "$SOURCE_SHA" ]]; then
            script=../release-tools/scripts/archive_local_package.py
          fi
          bundle_name="drydock-local-${RELEASE_TAG:-ci}-$PLATFORM-py$PYTHON_MINOR"
          python "$script" --bundle "$RUNNER_TEMP/drydock-bundle" \
            --out "$RUNNER_TEMP/release-assets" --name "$bundle_name" \
            --revision "$(git rev-parse HEAD)"
          echo "BUNDLE_NAME=$bundle_name" >> "$GITHUB_ENV"
      - name: Install from the archive using only bundled wheels
        run: |
          cd "$RUNNER_TEMP/release-assets"
          shasum -a 256 -c "$BUNDLE_NAME.tar.gz.sha256"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$BUNDLE_NAME.tar.gz" -C "$RUNNER_TEMP/unpacked"
          PYTHON="$(command -v python)" bash "$RUNNER_TEMP/unpacked/$BUNDLE_NAME/install.sh" "$RUNNER_TEMP/drydock-installed"
      - name: Verify installed entry point, offline checks and exact source parity
        run: |
          "$RUNNER_TEMP/drydock-installed/bin/python" -I scripts/verify_local_package.py \
            --reference "$RUNNER_TEMP/source-reference.json"
      - name: Rebuild the source archive without the Shipit checkout
        run: |
          python -m pip wheel --no-deps --no-build-isolation --no-index \
            --wheel-dir "$RUNNER_TEMP/rebuilt" "$RUNNER_TEMP/drydock-bundle/drydock-local-source.tar.gz"
      - name: Keep the reviewed installation bundle
        uses: actions/upload-artifact@v4
        with:
          name: drydock-local-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/drydock-bundle/wheelhouse/
            ${{ runner.temp }}/drydock-bundle/install.txt
            ${{ runner.temp }}/drydock-bundle/install.sh
            ${{ runner.temp }}/drydock-bundle/README.md
            ${{ runner.temp }}/drydock-bundle/build-info.json
            ${{ runner.temp }}/drydock-bundle/drydock-local-source.tar.gz
      - name: Keep verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: drydock-release-${{ matrix.platform }}-py${{ matrix.python }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/release-assets/*
