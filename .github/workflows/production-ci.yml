name: production-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-ci:
    name: production-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      API_KEY_PEPPER: ci-pepper-not-a-real-secret
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --check "$BASE_SHA" "$HEAD_SHA"
              ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
                git diff-tree --check --root -r "$GITHUB_SHA"
              else
                git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
              fi
              ;;
            workflow_dispatch)
              git diff-tree --check --root -r HEAD
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

      - name: Scan added lines for strong secret signatures
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -Eeuo pipefail

          empty_tree="$(git hash-object -t tree /dev/null)"

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              scan_base="$BASE_SHA"
              scan_head="$HEAD_SHA"
              ;;
            push)
              scan_head="$GITHUB_SHA"

              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
                scan_base="$empty_tree"
              else
                scan_base="$BEFORE_SHA"
              fi
              ;;
            workflow_dispatch)
              scan_head="$GITHUB_SHA"

              if git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
                scan_base="${GITHUB_SHA}^"
              else
                scan_base="$empty_tree"
              fi
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          python3 .github/scripts/scan-added-secrets.py             "$scan_base"             "$scan_head"

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          checked=0

          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
            checked=$((checked + 1))
          done < <(git ls-files -z '*.sh')

          ((checked > 0))
          echo "Validated $checked shell scripts"

      # bash -n above is a syntax check and nothing more. It passed happily on
      # a deploy script whose rollback reported success after failing, because
      # that bug was semantic: a function invoked under `||` runs with errexit
      # disabled for its whole body. shellcheck names exactly that (SC2310),
      # which is why check-set-e-suppressed is enabled explicitly rather than
      # relying on the default severity, where it does not fire.
      #
      # Scoped to that one optional check on purpose. Turning on --enable=all
      # adds nine SC2312 findings that have nothing to do with this class of
      # bug, and a gate that fails for unrelated reasons is a gate people
      # start skipping.
      # DO NOT REACH FOR apt UNLESS SOMETHING IS MISSING. This step used to
      # run `apt-get update && apt-get install shellcheck` unconditionally. On
      # 2026-08-19 the apt mirror stopped answering and the step hung twice in
      # a row, on two different runners, nine minutes each — while `smoke` and
      # `web-build`, the two workflows that touch no apt, passed on the same
      # commit in under a minute. Every merge in the repository was blocked by
      # a package manager fetching a binary the runner image already ships.
      #
      # The job's timeout-minutes: 30 does bound it, so this was never an
      # infinite hang — but thirty minutes of yellow per attempt is a gate
      # nobody can work with, and the failure it eventually reports has
      # nothing to do with the change under test.
      - name: Lint shell scripts
        shell: bash
        # A second bound, inside the job's own. The install is the only part
        # of this workflow that talks to a third-party host, so it is the only
        # part that can stall on one — and when it does, failing in three
        # minutes tells you that much more usefully than failing in thirty.
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail

          if ! command -v shellcheck > /dev/null; then
            echo "shellcheck not in the runner image — installing"
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

          git ls-files -z '*.sh' | xargs -0 shellcheck \
            --severity=info \
            --enable=check-set-e-suppressed

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked application and development dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install \
            --require-hashes \
            -r requirements.txt \
            -r requirements-dev.txt

          python -m pip install -e . --no-deps

      # requirements-dev.txt is compiled with --extra=dev, so it is meant to be
      # requirements.txt plus the test tooling. It silently stopped being that:
      # redis[hiredis] was added to the runtime dependencies and only
      # requirements.txt was recompiled, so the dev lock was short two packages
      # for weeks. Nothing here caught it, because this job installs BOTH files
      # and so had redis either way. The jobs that install only the dev lock --
      # db-postgres-smoke, e2e-sandbox-runner -- survived only because they run
      # named test files rather than the whole suite; a plain `pytest` on a
      # fresh clone aborted during collection on tests/test_ratelimit_redis.py,
      # taking all 1153 tests with it.
      #
      # Compares the pinned sets rather than recompiling: pip-compile output
      # depends on the interpreter it runs under (requirements.txt says 3.14 in
      # its header, this job is 3.12), so a recompile-and-diff check would fail
      # on the machine rather than on the lock.
      - name: Check the dev lock still contains the runtime lock
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import re
          import sys


          def pinned(path):
              text = open(path, encoding="utf-8").read()
              return {
                  m.group(1).lower(): m.group(2)
                  for m in re.finditer(
                      r"^([A-Za-z0-9_.\-]+)==(\S+?)\s*\\?$", text, re.MULTILINE
                  )
              }


          runtime = pinned("requirements.txt")
          dev = pinned("requirements-dev.txt")

          missing = sorted(set(runtime) - set(dev))
          conflicting = sorted(
              f"{name}: requirements.txt=={runtime[name]} "
              f"requirements-dev.txt=={dev[name]}"
              for name in set(runtime) & set(dev)
              if runtime[name] != dev[name]
          )

          if missing or conflicting:
              for name in missing:
                  print(f"missing from requirements-dev.txt: {name}=={runtime[name]}")
              for line in conflicting:
                  print(f"version conflict: {line}")
              print(
                  "\nRecompile the dev lock:\n"
                  "  pip-compile --extra=dev --generate-hashes --strip-extras \\\n"
                  "      --output-file=requirements-dev.txt pyproject.toml"
              )
              sys.exit(1)

          print(f"requirements-dev.txt covers all {len(runtime)} runtime pins")
          PY

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path

          import yaml

          paths = sorted(Path(".github/workflows").glob("*.y*ml"))
          if not paths:
              raise SystemExit("No workflow files found")

          for path in paths:
              with path.open("r", encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)

              if not isinstance(document, dict):
                  raise SystemExit(f"{path}: top-level YAML must be a mapping")

              print(f"Validated {path}")
          PY

      - name: Prepare production-like systemd validation environment
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo mkdir -p /opt

          if [[ -e /opt/shipit || -L /opt/shipit ]]; then
            test "$(readlink -f /opt/shipit)" = "$GITHUB_WORKSPACE"
          else
            sudo ln -s "$GITHUB_WORKSPACE" /opt/shipit
          fi

          touch .env
          mkdir -p .venv/bin
          ln -sf "$(command -v python)" .venv/bin/python

          sudo mkdir -p /srv/shipit

          if [[
            -e /srv/shipit/current ||
            -L /srv/shipit/current
          ]]; then
            test "$(
              readlink -f /srv/shipit/current
            )" = "$GITHUB_WORKSPACE"
          else
            sudo ln -s               "$GITHUB_WORKSPACE"               /srv/shipit/current
          fi

          test -x             /srv/shipit/current/.venv/bin/python

          if ! id shipit-ops >/dev/null 2>&1; then
            sudo useradd \
              --system \
              --no-create-home \
              --shell /usr/sbin/nologin \
              shipit-ops
          fi

          cat > /tmp/shipit.service <<'UNIT'
          [Unit]
          Description=ShipIt CI dependency stub

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/true
          UNIT

      - name: Validate systemd units
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t units < <(
            find deploy/systemd \
              -maxdepth 1 \
              -type f \
              \( -name '*.service' -o -name '*.timer' \) \
              -print |
            sort
          )

          ((${#units[@]} > 0))

          printf 'Validating %d systemd units\n' "${#units[@]}"

          systemd-analyze verify \
            /tmp/shipit.service \
            "${units[@]}"

      # Lint before the suite: ruff catches undefined names, unused imports and
      # dead locals in seconds, so a typo that would only surface as a confusing
      # test failure (or not at all, in a branch tests do not reach) fails fast
      # and cheap. Rules are pinned in pyproject.toml [tool.ruff] -- F and E
      # only, deliberately narrow. Keep this step BEFORE "Run test suite".
      - name: Lint Python with ruff
        shell: bash
        run: |
          set -Eeuo pipefail
          ruff --version
          ruff check .

      - name: Run test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q
