name: browser-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Native expectations and import boundaries
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests/test_browser_static.py tests/test_browser_cve.py tests/test_browser_parser_probes.py tests/test_sca_resolved_locks.py tests/detectors -q
          python browser/scripts/corpus.py browser/test-dist/cases.json
      - name: Build self-hosted runtime
        run: |
          npm --prefix browser ci --ignore-scripts
          npm --prefix browser run build
          node browser/scripts/prepare-harness.mjs
      - name: WASM profile parity
        run: |
          node --test browser/tests/parity.test.mjs
          npm --prefix browser run test:wasm
      - name: Chromium UI, offline corpus and exports
        run: |
          cd browser
          npx playwright install --with-deps chromium
          node scripts/verify-report-ui.mjs
          python scripts/serve.py > /tmp/drydock-browser-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
          node scripts/verify-browser.mjs
      - name: Validate downloaded SARIF
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft7Validator, FormatChecker
          schema = json.load(open('tests/fixtures/sarif-schema-2.1.0.json'))
          report = json.load(open('browser/measurements/report.sarif'))
          Draft7Validator(schema, format_checker=FormatChecker()).validate(report)
          PY
      - name: Keep reproducible coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-scan-evidence
          path: browser/measurements/
