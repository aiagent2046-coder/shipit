name: smoke-deploy-pack

# Manual only. This is the ONE place Deploy Pack's docker build + run +
# curl path gets exercised for real — our own dev sandboxes have no
# docker binary at all. GitHub-hosted ubuntu-latest runners come with
# Docker pre-installed, so this is the cheapest real host available.
on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install shipit (locked, hash-verified deps)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Real docker build + run + curl for all three stacks
        run: python scripts/smoke_verify_deploy_pack.py

      - name: "Real preview: keep-alive container, curl, reap"
        run: python scripts/smoke_verify_preview.py

      - name: "Real reap endpoint: auth + HTTP round trip against uvicorn"
        run: python scripts/smoke_verify_reap_endpoint.py
