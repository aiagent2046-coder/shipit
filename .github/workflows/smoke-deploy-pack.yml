name: smoke-deploy-pack

# Manual only. This is the ONE place Deploy Pack's docker build + run +
# curl path gets exercised for real — our own dev sandboxes have no
# docker binary at all. GitHub-hosted ubuntu-latest runners come with
# Docker pre-installed, so this is the cheapest real host available.
on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shipit
        run: pip install -e ".[dev]"

      - name: Real docker build + run + curl for both stacks
        run: python scripts/smoke_verify_deploy_pack.py
