name: smoke-deploy-pack

# Manual only. This is the ONE place Deploy Pack's docker build + run +
# curl path gets exercised for real — our own dev sandboxes have no
# docker binary at all. GitHub-hosted ubuntu-latest runners come with
# Docker pre-installed, so this is the cheapest real host available.
on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # The prod host runs an egress-allowlist Squid (host.docker.internal:3128)
    # and a pre-created `shipit-preview` network; a GitHub runner has neither.
    # Empty the build proxy so `docker build` hits the open internet, and create
    # the preview network below so `docker run --network shipit-preview` resolves.
    # Both mirror what the deploy host provides.
    env:
      DEPLOYPACK_BUILD_PROXY_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shipit (locked, hash-verified deps)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Create the preview network + block its egress (host-configured on prod)
        run: |
          set -euxo pipefail
          # NORMAL bridge (NOT --internal): --internal removes the gateway/NAT
          # and breaks `-p` port publishing, so the host boot-check curl never
          # gets a reply. Keep the bridge and cut egress with iptables instead.
          docker network create shipit-preview
          SUBNET=$(docker network inspect shipit-preview \
                   -f '{{(index .IPAM.Config 0).Subnet}}')
          echo "preview subnet: $SUBNET"
          # Drop traffic leaving the preview subnet for anywhere outside it.
          # Published-port replies stay in-subnet (proxied via the gateway), so
          # inbound/boot-check is unaffected; only real egress is dropped.
          sudo iptables -I DOCKER-USER -s "$SUBNET" ! -d "$SUBNET" -j DROP

      - name: Assert the preview network truly has no internet egress
        run: |
          set -uxo pipefail
          # A container on shipit-preview must NOT reach the internet. This is
          # the half a mock-based unit test can't prove — do it for real.
          if docker run --rm --network shipit-preview alpine:3 \
               sh -c 'wget -q -T 5 -O /dev/null https://example.com'; then
            echo "FAIL: preview network reached the internet — egress not blocked" >&2
            exit 1
          fi
          echo "OK: egress from shipit-preview is blocked"

      - name: Real docker build + run + curl for all three stacks
        run: python scripts/smoke_verify_deploy_pack.py

      - name: "Real preview: keep-alive container, curl, reap"
        run: python scripts/smoke_verify_preview.py

      - name: "Real reap endpoint: auth + HTTP round trip against uvicorn"
        run: python scripts/smoke_verify_reap_endpoint.py
