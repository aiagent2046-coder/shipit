name: Optional Ghidra static evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/inspect_binary_ghidra.py'
      - 'scripts/ghidra/**'
      - 'tests/test_ghidra_evidence.py'
      - 'app/scan/binary_evidence.py'
      - 'app/scan/project_checks.py'
      - 'scripts/attach_binary_evidence.py'
      - 'tests/test_binary_evidence.py'
      - 'tests/test_project_checks.py'
      - 'tests/fixtures/ghidra/**'
      - '.github/workflows/ghidra-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_binary_ghidra.py'
      - 'scripts/ghidra/**'
      - 'tests/test_ghidra_evidence.py'
      - 'app/scan/binary_evidence.py'
      - 'app/scan/project_checks.py'
      - 'scripts/attach_binary_evidence.py'
      - 'tests/test_binary_evidence.py'
      - 'tests/test_project_checks.py'
      - 'tests/fixtures/ghidra/**'
      - '.github/workflows/ghidra-evidence.yml'
permissions:
  contents: read
jobs:
  native-static-facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Failure-contract tests
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest --noconftest -q tests/test_ghidra_evidence.py tests/test_binary_evidence.py
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ghidra-12.2.zip
          key: ghidra-12.2-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
      - name: Download and verify pinned distribution
        env:
          ARCHIVE: ${{ runner.temp }}/ghidra-12.2.zip
        run: |
          if [ ! -f "$ARCHIVE" ]; then
            curl --fail --location --retry 3 --output "$ARCHIVE" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          fi
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $ARCHIVE" | sha256sum --check --strict
      - name: Compile fixture without executing it
        run: |
          mkdir -p artifacts
          gcc -O0 -g0 -fno-pie -no-pie -Wl,--build-id=none tests/fixtures/ghidra/static_sample.c -o artifacts/static_sample.elf
      - name: Analyze twice in independent temporary projects
        env:
          ARCHIVE: ${{ runner.temp }}/ghidra-12.2.zip
        run: |
          python scripts/inspect_binary_ghidra.py artifacts/static_sample.elf --ghidra-archive "$ARCHIVE" --java-home "$JAVA_HOME" --output artifacts/first.json --diagnostic-log artifacts/first.log
          python scripts/inspect_binary_ghidra.py artifacts/static_sample.elf --ghidra-archive "$ARCHIVE" --java-home "$JAVA_HOME" --output artifacts/second.json --diagnostic-log artifacts/second.log
          cmp artifacts/first.json artifacts/second.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('artifacts/first.json').read_text())
          assert result['status'] == 'completed'
          assert result['runtime_verified'] is False
          assert result['automatic_patch'] is False
          assert any(row['name'] == 'drydock_add' for row in result['facts']['functions'])
          assert any(row['name'] == 'puts' for row in result['facts']['imports'])
          print('Real Ghidra: function/import facts and two-project byte-identical reports passed.')
          PY
      - name: Bind native facts to the project check contract
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path
          from app.scan.binary_evidence import attach_binary_reports
          from app.scan.project_checks import project_checks
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, 'w') as archive:
              archive.writestr('bin/sample', Path('artifacts/static_sample.elf').read_bytes())
              archive.writestr('app.py', 'print("fixture")\n')
          raw = attach_binary_reports(buffer.getvalue(), [('bin/sample', Path('artifacts/first.json').read_bytes())])
          checks = project_checks(raw, {'checks_run': ['fixture'], 'findings': []}, {})
          binary = checks['binary_static']
          assert binary['status'] == 'completed', binary
          assert checks['archive_sha256'] == binary['archive_sha256'] == hashlib.sha256(raw).hexdigest()
          assert binary['artifacts'][0]['facts'] == json.loads(Path('artifacts/first.json').read_text())['facts']
          assert binary['runtime_verified'] is False
          Path('artifacts/project-checks.json').write_text(json.dumps(checks, sort_keys=True))
          print('Native Ghidra report accepted by the shared project importer with exact artifact/archive bindings.')
          PY
      - name: Malformed ELF never becomes completed
        env:
          ARCHIVE: ${{ runner.temp }}/ghidra-12.2.zip
        run: |
          # Valid ELF64 x86-64 header followed by garbage: Ghidra 12.2 exits 0 with no functions.
          python -c "import sys; d=open(sys.argv[1],'rb').read(64); open(sys.argv[2],'wb').write(d+b'\xff'*4096)" artifacts/static_sample.elf artifacts/malformed.elf
          status=0
          python scripts/inspect_binary_ghidra.py artifacts/malformed.elf --ghidra-archive "$ARCHIVE" --java-home "$JAVA_HOME" --output artifacts/malformed.json --diagnostic-log artifacts/malformed.log || status=$?
          test "$status" -eq 2
          python -c "import json; r=json.load(open('artifacts/malformed.json')); assert r['status'] != 'completed', r['reason']; print('Malformed ELF:', r['status'], r['reason'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghidra-static-evidence
          path: artifacts/
