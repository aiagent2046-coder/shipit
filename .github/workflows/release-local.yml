name: release-local

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed CalVer tag to package (e.g. v2026.09.16-1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-local-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an existing reviewed tag
        id: target
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]]
          sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/local-package.yml
    with:
      source_sha: ${{ needs.validate.outputs.sha }}
      release_tag: ${{ inputs.tag }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: drydock-release-*
          merge-multiple: true
          path: release-assets
      - name: Verify both platforms and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          cd release-assets
          assets=()
          for platform in linux-x86_64 macos-arm64; do
            name="drydock-local-$TAG-$platform-py3.12.tar.gz"
            test -f "$name"
            sha256sum -c "$name.sha256"
            assets+=("$name" "$name.sha256")
          done
          printf '%s\n' \
            "Local Drydock installation bundles for $TAG." \
            "" \
            "Source revision: $SOURCE_SHA" \
            "Requires Python 3.12 with venv: Linux x86_64 or macOS arm64." \
            "Download the matching tar.gz and sha256, verify the checksum, extract, then run bash install.sh." \
            "Installation and scan/watch/history work offline; only explicit catalog update downloads data." \
            "SHA-256 detects corruption; these assets are not digitally signed." \
            "Instructions: https://github.com/$GH_REPO/blob/main/docs/local-drydock.md" \
            > "$RUNNER_TEMP/local-release-notes.md"
          # No --clobber, edits or tag creation: an existing release fails closed.
          # A failed upload leaves a draft for inspection, never a partial public release.
          gh release create "$TAG" "${assets[@]}" --verify-tag --draft \
            --title "Drydock $TAG — local installers" \
            --notes-file "$RUNNER_TEMP/local-release-notes.md"
          gh release edit "$TAG" --draft=false --verify-tag
