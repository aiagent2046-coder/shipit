name: security-audit

# Supply-chain visibility for ShipIt's OWN dependencies (backend
# pyproject.toml lock + web/package.json). Two cheap things per ecosystem:
# generate a CycloneDX SBOM artifact ("what is actually deployed") and run a
# free vulnerability audit. Both audits BLOCK: pip-audit (the locked set is
# clean today, so this catches regressions) and `npm audit --audit-level=high`
# (the frontend cleared its high advisories in the next 14->16 upgrade, so a
# new high is a regression to fail on). No paid scanners.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Weekly, Monday 04:17 UTC (off the :00 mark on purpose).
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit + SBOM tools
        run: pip install pip-audit cyclonedx-bom

      - name: "pip-audit (BLOCKING) — locked runtime deps"
        run: pip-audit --require-hashes -r requirements.txt

      - name: Generate CycloneDX SBOM (backend)
        run: cyclonedx-py requirements requirements.txt -o sbom-python.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-python
          path: sbom-python.json

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Kept in step with web-build.yml and package.json's engines: jsdom
          # 30 does not run on Node 20. A second pin drifting from the first is
          # how one workflow starts testing a runtime nothing else uses.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: "npm ci — lockfile-exact install (also a lock-sync check)"
        run: npm ci

      - name: "npm audit (BLOCKING) — high and above"
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM (frontend)
        run: npm sbom --sbom-format cyclonedx > sbom-web.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-web
          path: web/sbom-web.json
