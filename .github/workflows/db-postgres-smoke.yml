name: db-postgres-smoke

# Real-Postgres schema + SQL smoke test. Applies EVERY migration in
# migrations/ (in order) to a fresh Postgres 17 service container, then
# exercises the write path of every repository in app/db.py against it with
# real SQL. This catches the class of bug the fake-based unit suite
# structurally cannot: a mismatch between a Python value's type and a real
# column type (e.g. passing a Unix int into the timestamptz `expires_at`
# column -> psycopg DatatypeMismatch), a missing column, or otherwise invalid
# SQL. The whole test suite runs with DATABASE_URL unset (tests/conftest.py),
# so those repository writes normally take the not-configured None path and
# never touch a database -- see POSTGRES_CI_SMOKE_TEST_PLAN.md.
#
# Postgres 17 matches the real Supabase major version (app/db.py's module
# docstring). Only fires on changes that can affect the schema/SQL contract.
on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "app/db.py"
      - "tests/test_db_postgres_smoke.py"
      - "tests/test_migration_ledger_postgres.py"
      - "tests/test_billing_concurrency_postgres.py"
      - "tests/test_audit_jobs_repo.py"
      - "tests/test_audit_worker_postgres.py"
      - "tests/test_internal_stats.py"
      - "app/worker/**"
      - "app/billing/**"
      - "scripts/apply_migrations.sh"
      - "scripts/migration_manager.py"
      - "deploy/scripts/check_release_migrations.py"
      - ".github/workflows/db-postgres-smoke.yml"
  pull_request:
    paths:
      - "migrations/**"
      - "app/db.py"
      - "tests/test_db_postgres_smoke.py"
      - "tests/test_migration_ledger_postgres.py"
      - "tests/test_billing_concurrency_postgres.py"
      - "tests/test_audit_jobs_repo.py"
      - "tests/test_audit_worker_postgres.py"
      - "tests/test_internal_stats.py"
      - "app/worker/**"
      - "app/billing/**"
      - "scripts/apply_migrations.sh"
      - "scripts/migration_manager.py"
      - "deploy/scripts/check_release_migrations.py"
      - ".github/workflows/db-postgres-smoke.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shipit_smoke
        ports:
          - 5432:5432
        # Wait until Postgres is actually accepting connections before the
        # steps run, so the migration step doesn't race the container.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Seen by both psql (the migration step) and pytest (which captures it at
      # import time; conftest deletes it at runtime, and the smoke test
      # re-injects the captured value -- see the test's module docstring).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shipit_smoke
      # AccountRepository.create hashes the API key and requires a pepper.
      # A throwaway CI value -- nothing here verifies a real key.
      API_KEY_PEPPER: ci-smoke-pepper-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shipit (locked, hash-verified deps)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps

      # Needs no database: catches a new migration with no `rollback-safe`
      # directive, or one whose SQL contradicts a `yes`. Runs before anything
      # is applied, because the answer does not depend on applying it and a
      # missing directive is cheapest to fix here.
      - name: Lint migration files
        run: python3 scripts/migration_manager.py lint

      - name: Apply all migrations in order
        run: bash scripts/apply_migrations.sh

      # The two hand-written parsers of psql's tab-separated ledger output.
      # Their unit tests build inputs as Python dicts and so have never seen
      # psql's actual bytes -- which is how a NULL column, rendered as an
      # empty trailing field, broke every read of the ledger and got past
      # them. Runs first: nothing below it works if the ledger cannot be read.
      - name: "Real-Postgres migration ledger parsing"
        run: pytest -q tests/test_migration_ledger_postgres.py

      # Races in the money paths, which fakes cannot express: every one of
      # them lives in the gap between a read and a write on one row, and a
      # fake dict has no such gap.
      - name: "Real-Postgres billing concurrency"
        run: pytest -q tests/test_billing_concurrency_postgres.py

      - name: "Real-Postgres repository write-path smoke"
        run: pytest -q tests/test_db_postgres_smoke.py

      # The audit queue's claim/lease semantics (FOR UPDATE SKIP LOCKED, the
      # partial idempotency index, the lease gate on every post-claim write) are
      # pure Postgres behaviour, so they are only ever exercised here -- the
      # default suite skips this file with DATABASE_URL unset.
      - name: "Real-Postgres audit queue claim/lease tests"
        run: pytest -q tests/test_audit_jobs_repo.py

      # The worker on top of that queue: the join between its decisions
      # (covered with a fake repository in tests/test_audit_worker.py) and
      # the rows they actually produce -- a transient failure coming back
      # after its backoff, a shutdown release refunding its attempt, four
      # slots on one pool never running the same job twice.
      - name: "Real-Postgres audit worker end-to-end tests"
        run: pytest -q tests/test_audit_worker_postgres.py

      # GET /internal/stats is nothing but SQL aggregation -- a state
      # histogram, a percentile, two trailing windows. A fake repository could
      # only prove the endpoint copies dict keys, so the aggregates are asserted
      # against planted rows here, including ones deliberately outside each
      # window. The heartbeat half of the file needs no database and also runs
      # in the default suite.
      - name: "Real-Postgres /internal/stats aggregate tests"
        run: pytest -q tests/test_internal_stats.py
