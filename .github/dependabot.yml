version: 2
updates:
  # Backend — reads pyproject.toml direct deps and updates the committed
  # requirements*.txt lock files (generated by pip-compile --generate-hashes).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    # pydantic-core is not a package anyone upgrades on purpose. pydantic
    # pins it exactly -- pydantic 2.13.4 requires pydantic-core==2.46.4, and
    # no released pydantic pairs with 2.47.0 -- so a group that bumps the
    # child without the parent cannot install at all.
    #
    # That is not hypothetical: #155 did exactly this and failed with
    # ResolutionImpossible on the first CI step. Ignoring it here lets the
    # rest of the group through; pydantic-core still moves whenever pydantic
    # itself is upgraded, which is the only way it should ever move.
    ignore:
      - dependency-name: pydantic-core
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Frontend — Next.js app; drives the breaking next 14->16 upgrade as its
  # own reviewable PR rather than blocking CI (see security-audit.yml).
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    # TypeScript 7 is the native port, and it deliberately does not ship the
    # JavaScript compiler API that Next.js links against:
    #
    #   TypeScript 7.0.2 does not provide the compiler API required by
    #   Next.js. Enable experimental.useTypeScriptCli in your Next.js
    #   config to use the TypeScript CLI, or install TypeScript 6 instead.
    #
    # That was #161, which failed web-build. The escape hatch exists, but it
    # is an experimental Next.js flag, and swapping the type checker the whole
    # frontend depends on is not a change to make because a bot offered it.
    # Revisit when Next.js supports TypeScript 7 outside experimental.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Keep the GitHub Actions pinned in our workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
