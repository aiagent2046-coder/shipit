[project]
name = "shipit"
version = "0.1.0"
description = "Autonomous rescue for vibe-coded apps: production audit + verified Fix Packs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
# smoke/ and scripts/ are fixtures/tooling, not part of the shipit
# package — without this, setuptools' flat-layout auto-discovery sees
# both app/ and smoke/ as top-level packages and refuses to guess.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
