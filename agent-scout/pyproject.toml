[project]
name = "agent-scout"
version = "0.1.0"
description = "Autonomous external security scout: passive recon -> drydock (shipit) engine -> responsible disclosure"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# Phase 3 (authorized mode): the dependency closure of shipit's full
# static+llm pipeline (LLM client, JS/TS grammars, PostgreSQL parser).
# DB drivers land here too (psycopg) with the connector slice.
active = [
    "httpx>=0.27",
    "tree-sitter>=0.26",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "pglast>=6",
    "psycopg[binary]>=3.2",
]

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
