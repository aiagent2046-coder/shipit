# Egress allowlist for the BUILD step — squid `dstdomain` list.
#
# Consumed by /etc/squid/squid.conf, which already had the right shape — this
# file replaces the inline domain lines, and NOTHING about http_access changes:
#
#     acl allowed_dst dstdomain "/etc/squid/squid-build-allowlist.conf"
#     http_access deny CONNECT !SSL_ports
#     http_access allow allowed_dst
#     http_access deny all
#
# A leading dot means "this domain and its subdomains"; a bare name is exact.
# Prefer the exact form for a single CDN host, the dotted form where prod
# already granted it (see the language-registry block — narrowing those would
# break builds that work today).
#
# WHY THIS FILE EXISTS. Until 2026-08-17 the allowlist lived only on the prod
# host — no copy in the repo, no review, no record of what was on it. The
# runtime-CORS detector measurement then failed on every backend it tried, and
# the reason could not be read from anything a reviewer could see. It turned
# out to be this list: LibreChat died at step 2 of 31 on
# `RUN apk upgrade --no-cache`, because `dl-cdn.alpinelinux.org` was not on it
# and squid answered 403. Seven seconds, no diagnosis, until
# app/proof/cors_probe.py grew its diagnostics channel. A control nobody can
# read is a control nobody can debug.
#
# WHAT THIS IS AND IS NOT (read before adding a line). For the build step this
# list is a CONVENTION, not a boundary. `docker build` in
# app/deploypack/sandbox.py gets NO `--network` flag — only proxy build-args
# (`HTTP_PROXY`/`HTTPS_PROXY`), which only well-behaved tools honour:
# apk, apt, pip, npm, curl. A build step that opens a raw socket, or a tool
# that ignores proxy env, reaches the open internet regardless of this file.
# (The RUN-time container is different: it gets `--network shipit-preview`
# with a host iptables DROP, which IS enforced. See _network_argv.)
#
# Two consequences, both honest:
#   1. Adding a domain here does not widen what a HOSTILE build can reach.
#      That surface is already the open internet. It only changes what an
#      honest build can fetch — i.e. whether we can boot customer code at all.
#   2. Therefore this file must not be described, internally or externally, as
#      the thing that contains a malicious Dockerfile. Enforcing build-step
#      egress needs `docker build --network` on an isolated network (or
#      BuildKit with a locked-down entitlement), and that is a separate change
#      with its own breakage risk. Tracked, not done here.
#
# Base images are NOT fetched through this proxy: `FROM node:24.16.0-alpine`
# is resolved by the host dockerd, not by the build container. That is why
# LibreChat's FROM succeeded (`---> 21f403ab171f`) while its first RUN did not,
# and why no docker-registry domain belongs on this list.

# --- OS package registries -------------------------------------------------
# The group that blocked the 2026-08-17 detector run. These are pure-GET
# mirrors that accept no uploads, and their packages are distro-signed — a
# weaker code-ingress channel than the language registries already allowed
# below, and a useless exfiltration channel to anyone who does not own them.
dl-cdn.alpinelinux.org
deb.debian.org
security.debian.org
archive.ubuntu.com
security.ubuntu.com
ports.ubuntu.com

# --- Language package registries -------------------------------------------
# THE FIRST THREE ARE A STRICT SUPERSET OF WHAT PROD ALREADY CARRIED, ON
# PURPOSE. The host's squid.conf (read 2026-08-17) allowed `.npmjs.org`,
# `.pypi.org`, `.pythonhosted.org` as inline `acl allowed_dst` entries. This
# file replaces those lines, so narrowing any of them to an exact hostname —
# `registry.npmjs.org` was the first draft — would break builds that work
# today in order to fix builds that do not. Keep the subdomain form.
#
# (A worry that did NOT survive contact with the host: `pypi.org` without
# `files.pythonhosted.org` fails every pip build at the wheel download, and
# this list was written expecting to find that gap. Prod already had both.)
.npmjs.org
.yarnpkg.com
.pypi.org
.pythonhosted.org
proxy.golang.org
sum.golang.org
.crates.io

# --- Deliberately NOT here -------------------------------------------------
# github.com, raw.githubusercontent.com, objects.githubusercontent.com — a
# categorically wider grant (arbitrary repositories and release binaries, not a
# curated package index) that some Dockerfiles do want. It is a separate
# decision; do not add it to make one build pass.
#
# Never add a bare TLD or a wildcard like `.com`, `.org`, `.io`. That is the
# failure mode this file is shaped to make visible in review, and
# tests/test_build_allowlist.py fails the suite if one appears.
