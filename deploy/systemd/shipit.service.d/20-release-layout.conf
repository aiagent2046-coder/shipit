# Release-specific overrides applied by deploy-production.sh / rollback-production.sh.
# WorkingDirectory, ExecStart, ExecStartPre, and --workers now live in the main
# shipit.service unit file. This drop-in is kept as a hook point for the release
# manager to override paths without touching the main unit.
#
# Uncomment and set when the release layout differs from the default:
# [Service]
# WorkingDirectory=/srv/shipit/current
# ExecStartPre=/usr/bin/test -x /srv/shipit/current/.venv/bin/python
# ExecStartPre=/srv/shipit/current/.venv/bin/python /srv/shipit/current/deploy/scripts/validate-production-env.py --env-file /opt/shipit/.env
# ExecStart=/srv/shipit/current/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2
