# Run the API as an unprivileged user instead of root.
#
# Applied by hand on production first and verified live there; this file only
# puts the already-running configuration under version control. Numbered 30 so
# it loads after 20-release-layout.conf, whose ExecStart=/ExecStartPre= resets
# would otherwise clear anything set here.
#
# Group shipit-runner is load-bearing, not defence in depth. The sandbox runner
# listens on /run/shipit-runner/sandbox.sock and access is gated by that
# directory's 0710 mode (see deploy/sandbox-runner/sandbox-runner.service), so
# as root the backend traversed it regardless. shipit-ops is not a member by
# default, and without this line every Deploy Pack verification, Fix Pack
# semantic check and preview reap loses the socket -- Deploy Pack degrades to
# verified=None and app/fixpack/semantic_check.py:is_regression treats an
# unreachable runner as "no regression" and ships the PR anyway, so the failure
# is silent rather than loud. That fail-open is a known, separate design
# problem; this drop-in must simply not trigger it.
#
# shipit-ops is the identity the audit worker and the timer units already use,
# and /srv/shipit/spool is provisioned 2770 shipit-ops. /opt/shipit/.env must be
# 0640 root:shipit-ops for the ExecStartPre validator, which runs as this user
# (README, "Host provisioning").
#
# Deliberately no hardening directives here (ProtectSystem, PrivateTmp,
# NoNewPrivileges, UMask, ...). The other units have that baseline and this one
# should get it too, but as its own change, so a startup failure or a silent
# degradation has exactly one candidate cause at a time. Note UMask especially:
# see the warning in sandbox-runner.service for what it cost there.
[Service]
User=shipit-ops
Group=shipit-ops
SupplementaryGroups=shipit-runner
