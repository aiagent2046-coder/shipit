[Unit]
OnFailure=shipit-alert@%n.service
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=3
Environment=ENVIRONMENT=production
EnvironmentFile=-/opt/shipit/.release-env
# Which process a log line came from, so one journalctl query spanning the API,
# the audit worker and the alerter can still tell them apart. Lives in this
# drop-in rather than the base unit because the base unit is the distro-managed
# one and every other production-only environment value is already here.
Environment=SHIPIT_SERVICE=shipit-api
ExecStartPre=/opt/shipit/.venv/bin/python /opt/shipit/deploy/scripts/validate-production-env.py
